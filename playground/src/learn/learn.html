<script>/* the workbench's theme choice (Settings → Theme), applied before first paint */

<style>
/*TOKENS*/
/*CODEMIRROR_CSS*/
* { box-sizing: border-box; }

.d-section ol { margin: 2px 0 6px 14px !important; border-left: 1px solid var(--line); }

.d-section a[aria-current] { color: var(--fg); font-weight: 600; border-left-color: var(--accent); }
.d-no { flex: none; width: 1.4em; text-align: right; font-size: 12px; }
.learn:not(.drawer-open) #drawer { visibility: hidden; }
.d-title { flex: 1; }

@media (max-width: 1100px) {
  #drawer { position: fixed; z-index: 30; top: 49px; bottom: 0; left: 0; box-shadow: var(--sh-2); }
  .learn.drawer-open #drawer { width: min(300px, 86vw); }
}
.kicker { margin: 0 0 4px !important; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }

.lesson-nav .btn.show { border-color: var(--accent); color: var(--accent); }
.lesson-no { font-size: 12px; color: var(--muted); margin-left: 4px; }
#lesson { flex: 1; overflow: auto; padding: 20px 24px 8px; }
#lesson h1 { font-size: 26px; line-height: 1.2; margin: 0 0 14px; }
#lesson h1:focus { outline: none; }
#lesson p { margin: 0 0 12px; max-width: 62ch; }
.lesson-nav { flex: none; display: flex; gap: 8px; justify-content: space-between; padding: 10px 24px; border-top: 1px solid var(--line); }
.task { margin: 16px 0; padding: 12px 14px; border-radius: var(--r-pane); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.task.ok { border-color: #2e8540; background: color-mix(in srgb, #2e8540 10%, var(--surface)); }
.task .hint { display: block; margin-top: 6px; font-size: 14px; color: var(--muted); }
.note { margin: 12px 0; padding: 10px 14px; border-left: 4px solid var(--line); background: var(--bg); border-radius: 0 var(--r-ctl) var(--r-ctl) 0; font-size: 15px; }
.note strong:first-child { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 2px; }
.note.pitfall { border-left-color: #c47a00; } .note.odd { border-left-color: #8a5cd0; } .note.why { border-left-color: var(--accent); } .note.alt { border-left-color: #2e8540; } .note.check { border-left-color: var(--muted); }
.steps { padding-left: 0; list-style: none; counter-reset: step; margin: 14px 0; }
.steps li { counter-increment: step; margin: 0 0 8px; }
.steps label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.steps input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.steps label > span::before { content: counter(step) ". "; font-weight: 700; }
.steps input:checked + span { color: var(--muted); text-decoration: line-through; }
.ask { margin: 16px 0; border: 1px solid var(--line); border-radius: var(--r-pane); padding: 10px 14px; }
.ask legend { font-weight: 700; padding: 0 4px; }
.ask label { display: flex; gap: 8px; align-items: center; margin: 4px 0; cursor: pointer; }
.ask-reply:empty { display: none; }
.ask-reply { margin: 8px 0 0 !important; font-weight: 600; }
.end { margin: 20px 0; padding: 14px 16px; border-radius: var(--r-pane); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.end h2 { margin: 0 0 6px; font-size: 20px; }

/* The code, its toolbar and the one result pane. */
.right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.code-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.code-bar .file { flex: 1; font-family: var(--mono); font-size: 14px; color: var(--muted); }
#code { flex: 1; min-height: 160px; }
#code .CodeMirror { height: 100%; font: 14px/1.5 var(--mono); background: var(--bg); color: var(--fg); }
.CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left-color: var(--fg); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 22%, transparent) !important; }
.sq-error { text-decoration: wavy underline #d32f2f; text-decoration-skip-ink: none; }
.sq-warning { text-decoration: wavy underline #c47a00; text-decoration-skip-ink: none; }
#pane { flex: none; max-height: 42%; overflow: auto; border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px 14px; font-size: 15px; }
.pane-title { font-size: 15px; margin: 0 0 8px; }
.probs { list-style: none; padding: 0; margin: 0; }
.prob { padding: 6px 0; border-bottom: 1px solid var(--line); }
.prob .sev { font-weight: 700; } .prob.error .sev { color: #d32f2f; } .prob.warning .sev { color: #8a5000; }
.prob .about { font-size: 13px; margin-left: 6px; }
.ok-line { color: #2e8540; font-weight: 600; margin: 0; }
.bad-line { color: #d32f2f; font-weight: 600; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.player { border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 12px; }
.player h3 { font-size: 15px; margin: 0 0 4px; }
.player p { margin: 0 0 4px; font-size: 14px; }
.player ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sq-error, :root:not([data-theme="light"]) .bad-line, :root:not([data-theme="light"]) .prob.error .sev { color: #ff7b72; text-decoration-color: #ff7b72; } :root:not([data-theme="light"]) .ok-line { color: #7ee787; } :root:not([data-theme="light"]) .prob.warning .sev { color: #e3b341; } }
:root[data-theme="dark"] .bad-line, :root[data-theme="dark"] .prob.error .sev { color: #ff7b72; } :root[data-theme="dark"] .ok-line { color: #7ee787; } :root[data-theme="dark"] .prob.warning .sev { color: #e3b341; }

/* Code blocks in the lessons: the lines to add highlighted (Svelte's diff), and the same lines in the editor after Show me. */
.lesson-code { margin: 0 0 14px; padding: 10px 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-ctl); font: 13px/1.55 var(--mono); overflow-x: auto; white-space: pre; }
.lesson-code .ln { display: block; width: max-content; min-width: 100%; padding: 0 12px; min-height: 1.55em; }
.lesson-code .ln.add { background: color-mix(in srgb, #2e8540 16%, transparent); box-shadow: inset 3px 0 #2e8540; }
.lesson-code .ln.gap { color: var(--muted); }
.lesson-code .ln.del { background: color-mix(in srgb, #d32f2f 14%, transparent); box-shadow: inset 3px 0 #d32f2f; text-decoration: line-through; text-decoration-color: color-mix(in srgb, #d32f2f 60%, transparent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.diff-add { background: color-mix(in srgb, #2e8540 18%, transparent); }
.task-acts { display: block; margin-top: 8px; }
.task .btn.show { border-color: var(--accent); color: var(--accent); }
.code-bar .keys { font-size: 12.5px; margin-right: 6px; }
@media (max-width: 860px) { .code-bar .keys { display: none; } }
/* Suggestions (CodeMirror's show-hint), in the page's colours. */
.CodeMirror-hints { position: absolute; z-index: 60; list-style: none; margin: 0; padding: 4px; max-height: 18em; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); box-shadow: var(--sh-2); font: 13px var(--mono); }
.CodeMirror-hint { display: flex; gap: 12px; justify-content: space-between; padding: 3px 8px; border-radius: 4px; color: var(--fg); cursor: pointer; white-space: pre; }
.CodeMirror-hint .h-detail { color: var(--muted); font-family: var(--font); font-size: 12px; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; }
li.CodeMirror-hint-active { background: var(--accent); color: var(--accent-fg); }
li.CodeMirror-hint-active .h-detail { color: inherit; opacity: .85; }
/* "Try it in Nucleus Co-op now", once a lesson's code works (folded until asked for). */
.checkpoint { margin: 0 0 16px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: var(--r-pane); padding: 0 14px; }
.checkpoint summary { cursor: pointer; font-weight: 700; padding: 10px 0; color: var(--accent); }
.checkpoint[open] { padding-bottom: 10px; }
.checkpoint ol { padding-left: 20px; margin: 0 0 10px; }
.checkpoint li { margin: 0 0 6px; }
/* The setup lesson: just the lesson, in the middle of the page. */
.learn.solo .right { display: none; }
.learn.solo .lesson { flex: 1; border-right: 0; }
.learn.solo #lesson-body { max-width: 760px; margin: 0 auto; }
.learn.solo .lesson-nav { justify-content: center; gap: 24px; }
/* The first lesson takes the whole page: the scene with its text. */
.learn.intro .lesson { display: none; }
.scene-title { font-size: 30px; margin: 0 0 10px; text-align: center; }
#scene > p { font-size: 17px; }
/* The first lesson's scene: windows that fight, then get along. */
#scene { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; }
.stage { position: relative; width: min(560px, 100%); aspect-ratio: 16 / 9; border: 10px solid #2b2f36; border-radius: 10px; background: #0f1720; overflow: hidden; margin-bottom: 18px; }
.win { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(160deg, #1e5fbf, #2aa0e8); color: #fff; transition: all .45s ease; }
.win .wt { flex: none; font: 12px var(--mono); padding: 3px 8px; background: rgba(0, 0, 0, .35); }
.win .wb { flex: 1; display: grid; place-items: center; font-size: 34px; }
.win .who { flex: none; font-size: 13px; font-weight: 700; padding: 4px 8px; background: rgba(0, 0, 0, .25); }
.win.w2 { background: linear-gradient(160deg, #b8380e, #f08a1c); inset: 8% 0 0 8%; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
.win.paused { filter: grayscale(.8) brightness(.7); }
.win .pause { font-size: 16px; font-weight: 700; background: rgba(0, 0, 0, .55); padding: 6px 12px; border-radius: 6px; }
#scene[data-step="2"] .w2 { z-index: 2; } #scene[data-step="2"] .w1 { z-index: 3; inset: 0 8% 8% 0; }
#scene[data-step="3"] .w1 { inset: 0 50% 0 0; } #scene[data-step="3"] .w2 { inset: 0 0 0 50%; box-shadow: none; border-left: 2px solid #0f1720; }
@media (prefers-reduced-motion: reduce) { .win { transition: none; } }
.say { max-width: 56ch; text-align: center; font-size: 17px; min-height: 3.2em; }
.fixes { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.fixes li { padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, #2e8540 14%, var(--surface)); border: 1px solid color-mix(in srgb, #2e8540 45%, var(--line)); }
.fixes li::before { content: "✓ "; color: #2e8540; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .fixes li { animation: pop .3s ease both; animation-delay: calc(var(--i) * 120ms); } @keyframes pop { from { opacity: 0; transform: translateY(6px); } } }
#scene > p { max-width: 56ch; text-align: center; }
.scene-acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* Docs on hover. */
#tip { position: fixed; z-index: 50; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--sh-2); font-size: 14px; max-height: 50vh; overflow: auto; }
#tip p { margin: 0 0 6px; } #tip pre { margin: 0 0 6px; white-space: pre-wrap; font: 13px/1.45 var(--mono); }

/* The lesson list. */

/* A phone or a narrow window: the lesson, then the code under it. */
@media (max-width: 860px) {
  body { height: auto; display: block; }
  .learn { display: block; }
  .lesson { min-width: 0; }
  .lesson { border-right: 0; border-bottom: 1px solid var(--line); }
  #lesson { overflow: visible; padding: 16px; }
  .lesson-nav { position: sticky; bottom: 0; background: var(--surface); padding: 10px 16px; z-index: 5; }

  #scene { padding: 16px; }
}
</style>

<body>
<header class="top">
  <button type="button" class="btn small" id="drawer-toggle" aria-controls="drawer" aria-expanded="false" title="The lesson list"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Lessons</button>
  <a class="home" href="../">Nucleus <span>Workbench</span></a>
  <div class="where"><span class="muted" aria-hidden="true">›</span> <strong id="chapter-title">Learn</strong> <span id="count" class="muted"></span><div class="progress" aria-hidden="true"><span id="bar"></span></div></div>
  <nav class="top-links" aria-label="Site"><a href="../">Workbench</a><a href="../docs/">Docs</a><a href="../rules/">Checks</a><a href="../start/">Get the tools</a></nav>
</header>
<main class="learn">
  <nav id="drawer" aria-label="All lessons"><ul id="drawer-list"></ul></nav>
  <section class="lesson" aria-labelledby="lesson-title">
    <div id="lesson"><div id="lesson-body"></div></div>
    <nav class="lesson-nav" aria-label="Lessons">

      <button type="button" class="btn show" id="show" data-act="show" hidden>Show me</button>
      <button type="button" class="btn" id="next">Next ›</button>
    </nav>
  </section>
  <section class="right" aria-label="Your handler">

      <div class="code-bar"><span class="file">Boring Man Tutorial.js</span><span class="keys muted">Ctrl+Space suggestions · hover for docs</span><button type="button" class="btn small" id="reset" title="Back to how this lesson started">Reset</button></div>
      <div id="code"></div>
      <div id="pane" aria-live="polite"></div>

    <div id="scene" hidden></div>
  </section>
</main>
<div id="tip" role="tooltip" hidden></div>
<noscript><p style="padding:16px">The lessons run in your browser and need JavaScript.</p></noscript>
