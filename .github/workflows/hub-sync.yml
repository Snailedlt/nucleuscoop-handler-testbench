name: Hub sync
# Once a day: the only place our tools read the Hub's handler list. The index goes to the `data`
# branch (one commit, replaced each time), and the CLI, MCP server, VS Code, the workbench build and the
# weekly check read it from there:
#   https://raw.githubusercontent.com/Snailedlt/nucleuscoop-handler-testbench/data/hub-index.json
# so people using the tools add no load to hub.splitscreen.me's API.
on:
  schedule:
    - cron: '17 4 * * *' # before the workbench's daily build (04:41)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the Hub list once
        run: node tools/hub-sync.mjs "$RUNNER_TEMP/hub-index.json"
      - name: Take the data branch as it is (usage counts, mirrored handlers, covers)
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/data" || { mkdir -p "$RUNNER_TEMP/data" && git -C "$RUNNER_TEMP/data" init -q -b data; }
          cp "$RUNNER_TEMP/hub-index.json" "$RUNNER_TEMP/data/hub-index.json"
      - name: Mirror new handler versions and covers (only what changed since yesterday)
        run: node tools/hub-mirror.mjs "$RUNNER_TEMP/data"
      - name: Publish the data branch (one commit, replaced each time)
        working-directory: ${{ runner.temp }}/data
        run: |
          printf '# Hub index\n\nThe hub.splitscreen.me handler list, synced daily by `.github/workflows/hub-sync.yml` on `main`. Read by the tools instead of the Hub API.\n\n- `hub-index.json`: every handler (`tools/hub-sync.mjs`).\n- `hub/<id>.js`, `hub/packages.json`: each handler'"'"'s current version, fetched once per version (`tools/hub-mirror.mjs`); the workbench lists and opens all of them from here.\n- `hub/<id>.files.json`: the other files of that version'"'"'s package (`tools/hub-files.mjs`; small files with content, big ones by name and size), once per version; `files` in `packages.json` counts them.\n- `covers/<cover>.jpg`: the games'"'"' covers (IGDB, as the Hub shows them), once per cover.\n- `usage.json`: how many verified Hub handlers use each name, counted weekly by `.github/workflows/nightly.yml` (only counts, no handler code).\n' > README.md
          git add -A
          git -c user.name='hub-sync' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q --amend -m "Hub index $(date -u +%F)" 2>/dev/null || git -c user.name='hub-sync' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Hub index $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data
