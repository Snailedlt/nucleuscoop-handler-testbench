name: Test build
run-name: Test build of splitscreenme-vscode ${{ inputs.branch || 'claude/brave-thompson-maiubs' }}
# The tools as they'll be released, before they are: builds the real .vsix, ncdev.exe (with the Notepad++ plugin
# inside) and the plugin's zip from a splitscreenme-vscode branch, the way its Release workflow does, and publishes
# them here as the pre-release `test-build` (replaced each run). A local site built with
#   node build.mjs --preview --test-build
# links its downloads to it, so testers get the tools from the tools page like real users, just the newer version.
# It lives in this repo on purpose: the tools' update checks (ncdev update, the Notepad++ plugin, the live start
# page) only read splitscreenme-vscode's releases, so a test build never reaches anyone who didn't ask for it.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'splitscreenme-vscode branch to build (empty: the branch being tested for the next release)'
        required: false
        default: ''
  push:
    branches: [preview-ux]
    paths: ['.github/workflows/test-build.yml']

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  # Runs the extension branch's own npm scripts, so it gets no token that can write: read-only, and it hands the
  # built files to the publish job as an artifact. (Its scripts could change PATH or the environment of later steps
  # in this job, which is why publishing happens in a separate job.)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: ${{ inputs.branch || 'claude/brave-thompson-maiubs' }}
    outputs:
      ver: ${{ steps.vsix.outputs.ver }}
      sha: ${{ steps.vsix.outputs.sha }}
    steps:
      - name: The extension, at the branch's newest commit
        run: git clone --quiet --depth 1 --branch "$BRANCH" https://github.com/Snailedlt/splitscreenme-vscode ext
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test it
        working-directory: ext
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: The .vsix
        id: vsix
        working-directory: ext
        run: |
          VER=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p ../out
          npx vsce package --no-dependencies -o "../out/splitscreenme-vscode-v$VER-test.vsix"
      - name: ncdev.exe (with the Notepad++ plugin) and the plugin's zip, tested like a release
        working-directory: ext
        run: |
          npm run build
          sh scripts/build-native.sh win-x64,linux-x64
          node scripts/smoke-standalone.mjs dist-sea/ncdev-linux-x64
          cp dist-sea/ncdev.exe ../out/ncdev.exe
          (cd dist-sea && zip -q -X ../../out/NcDev.zip NcDev.dll)
      - uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: out/
          if-no-files-found: error
          retention-days: 3

  # The only job with a token that can write. It runs nothing from the extension: it checks the version and commit
  # it was handed, then publishes the three files as the `test-build` pre-release (replacing the last one).
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ inputs.branch || 'claude/brave-thompson-maiubs' }}
      VER: ${{ needs.build.outputs.ver }}
      SHA: ${{ needs.build.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-build
          path: out
      - name: Check what the build handed over
        run: |
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected version: $VER"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::Unexpected commit: $SHA"; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Unexpected branch name: $BRANCH"; exit 1; }
          ls out
          [ "$(ls out | LC_ALL=C sort | tr '\n' ' ')" = "NcDev.zip ncdev.exe splitscreenme-vscode-v$VER-test.vsix " ] || { echo "::error::Unexpected files"; exit 1; }
      - name: Publish the test-build pre-release (replacing the last one)
        run: |
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<EOF
          **For testing only: not released.** splitscreenme-vscode \`$BRANCH\` at [\`$SHA\`](https://github.com/Snailedlt/splitscreenme-vscode/commit/$SHA) (version $VER), built like a release.

          Get it the way users will: build the site with \`node build.mjs --preview --test-build\`, serve \`dist/pages\` and download from its tools page (\`/tools/\`). The steps are in the test guide.
          EOF
          gh release create test-build "out/splitscreenme-vscode-v$VER-test.vsix" out/ncdev.exe out/NcDev.zip --prerelease --target "$GITHUB_SHA" --title "Test build: v$VER ($SHA)" --notes-file notes.md
      - name: Summary
        run: |
          {
            echo "## Test build: v$VER ($BRANCH @ $SHA)"
            echo
            echo "https://github.com/$GH_REPO/releases/tag/test-build"
            echo
            echo "Local site with these downloads: \`node build.mjs --preview --test-build\` in playground/, then serve dist/pages."
          } >> "$GITHUB_STEP_SUMMARY"
