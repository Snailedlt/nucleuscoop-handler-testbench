# The workbench moved to Snailedlt/nucleus-devtools (https://snailedlt.github.io/nucleus-devtools/).
# This address now serves only a small page that forwards every old link (path, query and #link) there:
# moved/index.html for the root, moved/404.html for every other path.
name: Pages (moved note)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@v4
