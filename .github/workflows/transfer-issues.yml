# One-off: moves every issue (open and closed) of this archived repository to Snailedlt/nucleus-devtools, where the
# workbench now lives, and labels each `area: workbench` there. Pull requests can't be transferred and stay here.
# Needs the TRANSFER_TOKEN secret: a fine-grained token with Issues: Read and write on both repositories.
# Run it once from the Actions tab, then delete the token. Safe to run again: it only finds what's still here.
name: Transfer issues to nucleus-devtools
on:
  workflow_dispatch:
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
      FROM: Snailedlt/nucleuscoop-handler-testbench
      TO: Snailedlt/nucleus-devtools
    steps:
      - name: Transfer
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::No TRANSFER_TOKEN secret."; exit 1; }
          gh label create "area: workbench" -R "$TO" --color 1d76db --description "The browser workbench, Learn and the site (workbench/)" --force
          echo "| Old | New |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for n in $(gh issue list -R "$FROM" --state all --limit 1000 --json number -q '.[].number' | sort -n); do
            if url=$(gh issue transfer "$n" "$TO" -R "$FROM" 2>&1); then
              new=$(echo "$url" | grep -oE '[0-9]+$')
              gh issue edit "$new" -R "$TO" --add-label "area: workbench" >/dev/null || echo "::warning::#$n moved to #$new but couldn't be labelled."
              echo "#$n → $url"; echo "| #$n | $url |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::#$n: $url"; failed=$((failed + 1))
            fi
            sleep 1
          done
          [ "$failed" = 0 ] || { echo "::error::$failed issues couldn't be transferred (see the warnings)."; exit 1; }
